<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#4CAF50">

<title>Macro Bank</title>

<link rel="icon" type="image/png" sizes="32x32" href="icon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">  

<style>
:root{
  --bg:#121212;
  --card:#1E1E1E;
  --text:#E0E0E0;
  --accent:#00FF7F;
  --accent-light:#33FF99;
  --danger:#FF4C4C;
  --tab-bg:#00FF7F;
  --tab-text:#121212;
  --tab-active:#33FF99;
  --shadow:0 4px 12px rgba(0,0,0,0.5);
}
body{font-family:'Helvetica Neue',Arial,sans-serif;background:var(--bg);color:var(--text);margin:0;padding:clamp(8px, 2vw, 16px);max-width:100%;box-sizing:border-box;}
*, *::before, *::after { box-sizing: border-box; }
h2,h3{margin:clamp(4px, 1vw, 8px) 0;}
button{border:none;border-radius:clamp(8px, 3px, 12px);cursor:pointer;font-size:clamp(12px, 2.5vw, 14px);transition:0.2s;}
button:hover{opacity:0.85;}
.week-weight{font-size:clamp(10px, 2vw, 12px);color:#aaa;}
input,select{border-radius:clamp(6px, 1.5vw, 8px);border:1px solid #333;padding:clamp(6px, 1.5vw, 8px);font-size:clamp(14px, 2.5vw, 16px);width:100%;margin-top:clamp(4px, 1vw, 6px);background:#222;color:#E0E0E0;max-width:100%;box-sizing:border-box;}
select{appearance:none;}
.navigation{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}
.nav-link{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;}
.page{display:none;}
.page.active{display:block;}
.card{background:var(--card);padding:clamp(8px, 2vw, 16px);margin-bottom:clamp(8px, 2vw, 16px);border-radius:clamp(12px, 3vw, 16px);box-shadow:var(--shadow);}
.week-heading{font-size:clamp(16px, 4vw, 20px);margin-bottom:clamp(8px, 2vw, 12px);}
.primary-btn{background:var(--tab-bg);color:var(--tab-text);font-size:clamp(12px, 2.5vw, 14px);padding:clamp(6px, 1.5vw, 8px) clamp(8px, 2vw, 10px);margin-top:clamp(2px, 10px, 3px);min-height:clamp(28px, 5vw, 32px);}
#dailyMacros .primary-btn{font-size:clamp(12px, 2.5vw, 14px);padding:clamp(6px, 1.5vw, 8px) clamp(8px, 2vw, 10px);min-height:clamp(28px, 5vw, 32px);}
.primary-btn.nav-link{background:var(--tab-bg);color:var(--tab-text);border-radius:clamp(8px, 3px, 12px);font-size:clamp(12px, 2.5vw, 14px);padding:clamp(6px, 1.5vw, 8px) clamp(8px, 2vw, 10px);min-height:clamp(28px, 5vw, 32px);}
.primary-btn.nav-link:hover{background:var(--tab-active);color:var(--tab-text);border-radius:clamp(8px, 3px, 12px);}
.primary-btn.nav-link.active{background:var(--tab-active);color:var(--tab-text);font-weight:500;box-shadow:0 0 0 2px rgba(255,255,255,0.15);border-radius:clamp(8px, 3px, 12px);}
.danger-btn{background:rgb(178, 25, 25);color:#fff;font-size:clamp(12px, 2.5vw, 14px);padding:clamp(6px, 1.5vw, 8px) clamp(8px, 2vw, 10px);margin-top:clamp(2px, 10px, 3px);min-height:clamp(28px, 5vw, 32px);}
.water-btn{background:#3874b0;color:#fff;font-size:clamp(12px, 2.5vw, 14px);padding:clamp(6px, 1.5vw, 8px) clamp(8px, 2vw, 10px);margin-top:clamp(2px, 0.5vw, 3px);min-height:clamp(28px, 5vw, 32px);}
.entry-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid #333;}
.entry-row span{flex:1;display:block;margin-bottom:4px;}
.progress-container.weekly{background:#333;border-radius:clamp(8px, 2vw, 12px);height:clamp(10px, 2.5vw, 14px);overflow:hidden;margin:clamp(2px, 0.5vw, 4px) 0;}
.progress-container.daily{background:#333;border-radius:clamp(6px, 1.5vw, 10px);width:100%;max-width:clamp(200px, 30vw, 300px);height:clamp(6px, 1.5vw, 8px);overflow:hidden;margin:clamp(2px, 0.5vw, 4px) 0;}
.progress-bar{height:100%;width:0%;transition:0.3s;}
.remaining{margin-top:clamp(2px, 0.5vw, 4px);font-size:clamp(12px, 2.5vw, 14px);color:var(--text);}
.reset-btn{background:rgb(205, 42, 42);color:#121212;font-weight:600;font-size:clamp(12px, 2.5vw, 14px);padding:clamp(6px, 1.5vw, 8px) clamp(8px, 2vw, 10px);min-height:clamp(28px, 5vw, 32px);}
.current-week{border:2px solid var(--tab-bg);}
label{display:block;margin-top:clamp(6px, 1.5vw, 8px);font-weight:bold;}
.week-total{margin-top:clamp(8px, 2vw, 12px); margin-bottom:clamp(6px, 1.5vw, 10px);font-weight:bold;}
.water-group{margin-top:clamp(8px, 2vw, 12px);display:flex;gap:clamp(2px, 0.5vw, 4px);align-items:center;}
.side-bars{display:flex;gap:clamp(12px, 3vw, 16px);margin-top:clamp(6px, 1.5vw, 8px); padding:0;}
.bar-group{display:flex;flex-direction:column;align-items:center;}
.side-label{font-size:clamp(12px, 2.5vw, 14px);margin-top:clamp(2px, 0.5vw, 4px);}
.water-group input{flex:1;}
.helper-text{font-size:clamp(10px, 2vw, 12px);color:#aaa;margin-top:clamp(4px, 1vw, 6px);}
.per-day-goals{margin-top:clamp(6px, 1.5vw, 10px);}
.per-day-goals summary{cursor:pointer;font-weight:bold;font-size:clamp(12px, 2.5vw, 14px);color:var(--tab-bg);background:none;padding:0;border:none;display:inline-flex;align-items:center;}
.per-day-goals summary::before{content:'▶';display:inline-block;margin-right:8px;transition:transform 0.2s ease;color:var(--tab-bg);}
.per-day-goals[open] summary::before{content:'▼';}
.per-day-goals-row{display:flex;align-items:center;gap:clamp(6px, 1.5vw, 8px);margin-top:clamp(4px, 1vw, 6px);}
.per-day-goals-row label{min-width:clamp(70px, 15vw, 90px);font-weight:normal;margin-top:0;font-size:clamp(11px, 2vw, 13px);}
.per-day-goals-row input{flex:1;padding:clamp(4px, 1vw, 6px);font-size:clamp(11px, 2vw, 13px);}
.per-day-goals-row .clear-day-goal-btn{background:#444;color:#ccc;font-size:clamp(9px, 1.5vw, 11px);padding:clamp(2px, 0.5vw, 3px) clamp(3px, 0.75vw, 5px);white-space:nowrap;min-height:clamp(16px, 3.5vw, 18px);}

/* Mobile responsiveness */
@media (max-width: 768px) {
  body { padding: 8px; }
  .card { padding: 12px; margin-bottom: 12px; }
  .progress-container.daily { width: 100%; max-width: 300px; }
  .side-bars { flex-direction: row; gap: 8px; align-items: stretch; padding: 0px; }
  .bar-group { flex-direction: row; justify-content: space-between; align-items: center; }
  .bar-group .progress-container.daily { width: 35%; max-width: 120px; }
  .side-label { margin-top: 0; margin-left: 8px; font-size: 10px; white-space: nowrap; }
  .entry-row { flex-direction: column; align-items: flex-start; gap: 8px; }
  .per-day-goals-row { flex-direction: column; align-items: stretch; gap: 4px; }
  .per-day-goals-row label { min-width: auto; margin-bottom: 4px; }
  .water-group { flex-direction: column; gap: 8px; }
  h2, h3 { font-size: 8px; }
  .week-heading { font-size: 3px; }
  .remaining { font-size: 12px; }
  .side-label { font-size: 10px; }
  .helper-text { font-size: 10px; }
  .per-day-goals summary { font-size: 12px; }
  .per-day-goals-row label { font-size: 11px; }
  .per-day-goals-row input { font-size: 11px; }
}

@media (max-width: 480px) {
  .card { padding: 8px; }
  .week-heading { font-size: 12px; }
  h2 { font-size: 15px; }
  h3 { font-size: 12px; }
  .bar-group { flex-direction: column; align-items: stretch; }
  .bar-group .progress-container.daily { width: 100%; }
  .side-label { text-align: center; margin-top: 4px; font-size: 9px; }
  .primary-btn, .danger-btn, .water-btn { font-size: clamp(12px, 2.5vw, 14px); padding: clamp(6px, 1.5vw, 8px) clamp(8px, 2vw, 10px); min-height: clamp(28px, 5vw, 32px); }
  .remaining { font-size: 10px; }
  .helper-text { font-size: 9px; }
  .per-day-goals summary { font-size: 10px; }
  .per-day-goals-row label { font-size: 9px; }
  .per-day-goals-row input { font-size: 9px; }
  .entry-row { flex-direction: row; align-items: center; flex-wrap: wrap; gap: 4px; }
  .entry-row span { flex-shrink: 1; min-width: 0; font-size: 11px; }
}
</style>
</head>

<body>
<div class="card">
  <h2>Macro Bank</h2>
  <div class="navigation">
    <a href="#setGoals" class="primary-btn nav-link">Goals</a>
    <a href="#dailyMacros" class="primary-btn nav-link">Daily Macros</a>
    <a href="#week" class="primary-btn nav-link">Current Week Log</a>
    <a href="#previousWeeks" class="primary-btn nav-link">Previous Weeks</a>
    <a href="#theme" class="primary-btn nav-link">Settings</a>
  </div>
</div>

<section class="page active" id="week">
  <div id="currentWeekContainer"></div>
  <button id="resetBtn" class="reset-btn">Reset Week Data</button>
</section>

<section class="page" id="previousWeeks">
  <div class="card">
    <h3>Previous Weeks Log</h3>
    <button id="toggleHistoryBtn" class="primary-btn" style="margin-bottom:12px;">Show previous weeks</button>
    <div id="previousWeeksContainer"></div>
  </div>
</section>

<section class="page" id="setGoals">
  <div class="card" id="sharedProgress">
    <h3>Weekly Progress</h3>
    <div class="progress-container weekly">
      <div id="weeklyProgress" class="progress-bar"></div>
    </div>
    <div id="weeklyRemaining" class="remaining"></div>
  </div>
  <div class="card">
    <h3>Set Your Goals</h3>
    <label>Daily Calorie Goal:</label>
    <input type="number" id="dailyCalInput" placeholder="e.g., 1650" inputmode="numeric">
    <label style="display:flex;align-items:center;gap:8px;font-weight:normal;">
      <input type="checkbox" id="autoAdjustCalToggle" style="width:auto;margin-top:0;">
      Auto-adjust remaining daily calories
    </label>
    <div class="helper-text" id="autoAdjustHelperText"></div>

    <details class="per-day-goals" id="perDayGoalsDetails">
      <summary>Calorie goal per day</summary>
      <div id="perDayGoalsContainer"></div>
    </details>

    <label>Daily Protein Goal:</label>
    <input type="number" id="dailyProteinInput" placeholder="e.g., 140" inputmode="numeric">

    <label>Daily Water Goal (oz):</label>
    <input type="number" id="dailyWaterInput" placeholder="e.g., 64" inputmode="numeric">

    <label>Week Starting Weight (lbs):</label>
    <input type="number" id="weekStartWeight" placeholder="e.g., 180" inputmode="numeric">
  </div>
</section>

<section class="page" id="theme">
  <div class="card">
    <h3>Tab Colors</h3>
    
    <label style="font-weight:normal;display:block;margin-bottom:8px;">Tab Background Color:</label>
    <div id="bgColorPalette" style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;"></div>
    <input type="text" id="tabBgColorInput" placeholder="#00FF7F" style="margin-bottom:12px;font-family:monospace;">
    
    <label style="font-weight:normal;display:block;margin-bottom:8px;">Tab Text Color:</label>
    <div id="textColorPalette" style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;"></div>
    <input type="text" id="tabTextColorInput" placeholder="#121212" style="margin-bottom:12px;font-family:monospace;">
    
    <div style="display:flex;gap:8px;margin-top:8px;">
      <button id="saveThemeBtn" class="primary-btn">Save Colors</button>
      <button id="resetThemeBtn" class="danger-btn">Reset Colors</button>
    </div>
  </div>
</section>

<section class="page" id="dailyMacros">
  <div class="card">
    <h3>Weekly Progress</h3>
    <div class="progress-container weekly">
      <div id="weeklyProgressDaily" class="progress-bar"></div>
    </div>
    <div id="weeklyRemainingDaily" class="remaining"></div>
  </div>
  <div class="card" id="dailyProgressCard" style="display:none;">
    <h3 id="dailyProgressHeading">Daily Progress</h3>
    <div id="dailyProgressContent"></div>
  </div>
  <div class="card">
    <h3>Daily Macros</h3>
    <label>Add Whole Day:</label>
    <select id="day"></select>
    <input type="number" id="dailyCalories" placeholder="Calories (kcal)" inputmode="numeric" step="1">
    <input type="number" id="protein" placeholder="Protein (g)" inputmode="numeric" step="1">
    <input type="number" id="carbs" placeholder="Carbs (g)" inputmode="numeric" step="1">
    <input type="number" id="fat" placeholder="Fat (g)" inputmode="numeric" step="1">
    <button id="saveDayBtn" class="primary-btn">Save</button>
    <button id="clearEntryBtn" class="danger-btn">Clear</button>

    <!-- Water input -->
    <div class="water-group">
      <label>Water (oz):</label>
      <input type="number" id="waterAmount" placeholder="oz" inputmode="numeric">
      <button id="addWaterBtn" class="water-btn">Add Water</button>
      <button id="clearDayWaterBtn" class="danger-btn">Empty Water</button>
    </div>
        <!-- Food entry input -->
        <div style="margin-top:12px;">
          <h4 style="margin:6px 0 8px 0;">Add Food</h4>
          <input type="text" id="foodName" placeholder="Food name (e.g., Chicken Breast)" style="margin-top:6px;">
          <input type="number" id="foodCal" placeholder="Calories (kcal)" style="margin-top:6px;" inputmode="numeric">
          <input type="number" id="foodProtein" placeholder="Protein (g)" style="margin-top:6px;" inputmode="numeric">
          <input type="number" id="foodCarbs" placeholder="Carbs (g)" style="margin-top:6px;" inputmode="numeric">
          <input type="number" id="foodFat" placeholder="Fat (g)" style="margin-top:6px;" inputmode="numeric">
          <input type="number" id="foodQuantity" placeholder="Quantity" value="1" min="0.1" step="0.1" style="margin-top:6px;" inputmode="numeric">
            <div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;">
            <button type="button" id="addFoodBtn" class="primary-btn">Add Food</button>
            <button type="button" id="clearFoodsBtn" class="danger-btn">Clear Entry</button>
            <button type="button" id="saveFoodBtn" class="primary-btn">Save Food</button>
          </div>
          <div style="display:flex;justify-content:space-between;align-items:center;margin-top:10px;">
            <h4 style="margin:0;">Food Entries</h4>
            <button type="button" id="toggleFoodListBtn" class="primary-btn" style="font-size:11px;padding:3px 6px;">Hide</button>
          </div>
          <div id="foodEntriesList" style="margin-top:10px;"></div>
          <div id="savedFoodsSection" style="margin-top:16px;">
            <div style="display:flex;justify-content:space-between;align-items:center;">
              <h4 style="margin:8px 0 6px 0;">Saved Foods</h4>
              <button type="button" id="toggleSavedFoodListBtn" class="primary-btn" style="font-size:11px;padding:3px 6px;">Hide</button>
            </div>
            <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px;">
              <button type="button" id="loadSavedFoodBtn" class="primary-btn">Load</button>
              <button type="button" id="addSavedFoodEntryBtn" class="primary-btn">Add Saved</button>
            </div>
            <div id="savedFoodsList" style="margin-top:10px;"></div>
        </div>
  </div>
</section>

<script>
const dayNames = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
// order in which days are shown in UI; bottom‑to‑top sequence
// bottom element will be Sunday, then Monday, ... up to Saturday at top
const displayDayOrder = [6,5,4,3,2,1,0];

// Default Goals
let personalDailyCalGoal = parseInt(localStorage.getItem("personalDailyCalGoal")) || 1650;
let personalDailyProteinGoal = parseInt(localStorage.getItem("personalDailyProteinGoal")) || 120;
let personalDailyWaterGoal = parseFloat(localStorage.getItem("personalDailyWaterGoal")) || 64; // oz
let autoAdjustCalorieBudget = JSON.parse(localStorage.getItem("autoAdjustCalorieBudget") ?? "true");
let perDayCalGoals = JSON.parse(localStorage.getItem("perDayCalGoals")) || {};
let savedFoods = JSON.parse(localStorage.getItem("savedFoods") || "[]");
// if a previous value was stored in ml (large number), convert to oz
if(personalDailyWaterGoal > 1000){
  const ML_PER_OZ = 29.5735;
  personalDailyWaterGoal = personalDailyWaterGoal / ML_PER_OZ;
  localStorage.setItem("personalDailyWaterGoal", personalDailyWaterGoal);
}

// Tab colors
const defaultTabColors = {
  bg: '#00FF7F',
  text: '#121212'
};
let storedTabColors = JSON.parse(localStorage.getItem('tabColors')||'{}');
let tabColors = Object.assign({}, defaultTabColors, storedTabColors);

function hexToRgb(hex){
  hex = hex.replace('#','');
  if(hex.length === 3) hex = hex.split('').map(c => c + c).join('');
  const num = parseInt(hex,16);
  return {
    r: (num >> 16) & 255,
    g: (num >> 8) & 255,
    b: num & 255
  };
}

function rgbToHex({r,g,b}){
  const toHex = n => n.toString(16).padStart(2,'0');
  return `#${toHex(r)}${toHex(g)}${toHex(b)}`;
}

function darkenColor(hex, amount = 0.2){
  const rgb = hexToRgb(hex);
  const curve = value => Math.max(0, Math.round(value * (1 - amount)));
  return rgbToHex({
    r: curve(rgb.r),
    g: curve(rgb.g),
    b: curve(rgb.b)
  });
}

function applyTabColors(colors){
  const root = document.documentElement;
  root.style.setProperty('--tab-bg', colors.bg);
  root.style.setProperty('--tab-text', colors.text);
  root.style.setProperty('--tab-active', darkenColor(colors.bg, 0.18));
}

function initTabColorUI(){
  const bgI = document.getElementById('tabBgColorInput');
  const textI = document.getElementById('tabTextColorInput');
  const bgPalette = document.getElementById('bgColorPalette');
  const textPalette = document.getElementById('textColorPalette');
  
  if(bgI) bgI.value = tabColors.bg;
  if(textI) textI.value = tabColors.text;

  // Background color palette
  const bgColors = ['#000000','#FFFFFF','FFFFFF', '#00FF7F','#FF6B6B', '#4ECDC4', '#FFE66D', '#95E1D3', '#F38181', '#AA96DA', '#FCBAD3', '#A8D8EA', '#FF9999', '#45B7D1', '#2ECC71', '#E74C3C', '#F39C12', '#9B59B6', '#002147', '#3498DB', '#E67E22', '#16A085', '#D35400', '#C0392B', '#8E44AD', '#27AE60', '#2980B9', '#F1C40F', '#0D47A1', '#1565C0', '#1976D2', '#4A148C', '#6A1B9A', '#7B1FA2','#051D01','#063204', '#1B5E20', '#2E7D32', '#388E3C','#3C1414', '#B71C1C', '#C62828', '#D32F2F', '#E65100', '#F57C00', '#FB8C00', '#00695C', '#004D40', '#263238', '#37474F', '#455A64', '#546E7A'];
  if(bgPalette){
    bgPalette.innerHTML = bgColors.map(color => `
      <button type="button" style="width:40px;height:40px;background:${color};border:2px solid ${color===tabColors.bg?'#fff':'transparent'};border-radius:6px;cursor:pointer;transition:0.2s;" data-color="${color}" class="bg-color-btn"></button>
    `).join('');
    bgPalette.querySelectorAll('.bg-color-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        bgI.value = btn.dataset.color;
        bgPalette.querySelectorAll('.bg-color-btn').forEach(b => b.style.borderColor = b===btn?'#fff':'transparent');
      });
    });
  }

  // Text color palette
  const textColors = ['#121212', '#FFFFFF', '#333333', '#E0E0E0', '#000000', '#F5F5F5'];
  if(textPalette){
    textPalette.innerHTML = textColors.map(color => `
      <button type="button" style="width:40px;height:40px;background:${color};border:2px solid ${color===tabColors.text?'#FFD700':'#555'};border-radius:6px;cursor:pointer;transition:0.2s;" data-color="${color}" class="text-color-btn"></button>
    `).join('');
    textPalette.querySelectorAll('.text-color-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        textI.value = btn.dataset.color;
        textPalette.querySelectorAll('.text-color-btn').forEach(b => b.style.borderColor = b===btn?'#FFD700':'#555');
      });
    });
  }

  const saveBtn = document.getElementById('saveThemeBtn');
  const resetBtn = document.getElementById('resetThemeBtn');
  if(saveBtn){
    saveBtn.addEventListener('click', ()=>{
      tabColors = {
        bg: bgI.value || defaultTabColors.bg,
        text: textI.value || defaultTabColors.text
      };
      applyTabColors(tabColors);
      localStorage.setItem('tabColors', JSON.stringify(tabColors));
      initTabColorUI();
    });
  }
  if(resetBtn){
    resetBtn.addEventListener('click', ()=>{
      if(!confirm('Reset tab colors to defaults?')) return;
      tabColors = Object.assign({}, defaultTabColors);
      applyTabColors(tabColors);
      localStorage.removeItem('tabColors');
      initTabColorUI();
    });
  }

  // Update palette border when text input changes
  if(bgI) bgI.addEventListener('input', () => {
    if(bgPalette) bgPalette.querySelectorAll('.bg-color-btn').forEach(btn => {
      btn.style.borderColor = btn.dataset.color===bgI.value?'#fff':'transparent';
    });
  });
  if(textI) textI.addEventListener('input', () => {
    if(textPalette) textPalette.querySelectorAll('.text-color-btn').forEach(btn => {
      btn.style.borderColor = btn.dataset.color===textI.value?'#FFD700':'#555';
    });
  });
}

// apply tab colors on load
applyTabColors(tabColors);

// Returns the effective calorie goal for a given day index (0=Sun … 6=Sat).
// Uses a per-day override if set, otherwise falls back to the global daily goal.
function getEffectiveDailyCalGoal(dayIdx){
  const override = perDayCalGoals[dayIdx];
  return (override !== undefined && Number(override) > 0) ? Number(override) : (Number(personalDailyCalGoal) || 0);
}

// Sum of all 7 days' effective calorie goals.
function getWeeklyCalTarget(){
  let total = 0;
  for(let i=0;i<7;i++) total += getEffectiveDailyCalGoal(i);
  return total;
}

function getWeekKey(){
  const now = new Date();
  const firstJan = new Date(now.getFullYear(),0,1);
  const pastDays = Math.floor((now-firstJan)/86400000);
  const weekNumber = Math.ceil((pastDays + firstJan.getDay()+1)/7);
  return now.getFullYear() + "-W" + weekNumber;
}

function getDayTotals(day){
  if(!day) return {cal:0,p:0,c:0,f:0};
  if(day.totals){
    return {
      cal: Number(day.totals.cal) || 0,
      p: Number(day.totals.p) || 0,
      c: Number(day.totals.c) || 0,
      f: Number(day.totals.f) || 0,
    };
  }
  if(Array.isArray(day.entries)){
    return day.entries.reduce((sum, entry) => {
      const qty = Number(entry.qty) || 1;
      sum.cal += (Number(entry.cal) || 0) * qty;
      sum.p += (Number(entry.p) || 0) * qty;
      sum.c += (Number(entry.c) || 0) * qty;
      sum.f += (Number(entry.f) || 0) * qty;
      return sum;
    }, {cal:0,p:0,c:0,f:0});
  }
  return {cal:0,p:0,c:0,f:0};
}

function normalizeWeekData(week){
  if(!week || !Array.isArray(week.entries)) return;
  week.entries = week.entries.map(day => {
    // Support both old shape ({totals, water}) and new shape ({entries: [...] , water})
    if(Array.isArray(day.entries)){
      const totals = getDayTotals(day);
      return {entries: day.entries.slice(), totals, water: Number(day.water) || 0};
    }
    if(day.totals){
      return {entries: [], totals: {
        cal: Number(day.totals.cal) || 0,
        p: Number(day.totals.p) || 0,
        c: Number(day.totals.c) || 0,
        f: Number(day.totals.f) || 0,
      }, water: Number(day.water) || 0};
    }
    return {entries: [], totals: {cal:0,p:0,c:0,f:0}, water: Number(day.water) || 0};
  });
}

function getAutoAdjustedCalorieGoals(weekData, weeklyTarget){
  const adjustedGoals = dayNames.map((_,i) => getEffectiveDailyCalGoal(i));

  if (!Array.isArray(weekData) || weekData.length !== 7 || weeklyTarget <= 0) {
    return adjustedGoals;
  }

  const dayCalories = weekData.map(day => {
    if (!day) return 0;
    return getDayTotals(day).cal;
  });

  const loggedDays = dayCalories
    .map((calories, idx) => ({ calories, idx }))
    .filter(item => item.calories > 0)
    .map(item => item.idx);

  if (!loggedDays.length) {
    return adjustedGoals;
  }

  const latestLoggedDay = Math.max(...loggedDays);
  const remainingDays = 6 - latestLoggedDay;

  if (remainingDays <= 0) {
    return adjustedGoals;
  }

  const consumedSoFar = dayCalories
    .slice(0, latestLoggedDay + 1)
    .reduce((sum, calories) => sum + calories, 0);

  const remainingWeeklyCalories = Math.max(weeklyTarget - consumedSoFar, 0);
  const evenRemainingGoal = remainingWeeklyCalories / remainingDays;

  for (let i = latestLoggedDay + 1; i < 7; i++) {
    adjustedGoals[i] = evenRemainingGoal;
  }

  return adjustedGoals;
}

  // Update daily progress bar

  const dailyProtGoal = personalDailyProteinGoal;
  const dailyWaterGoal = personalDailyWaterGoal;
  const waterOz = data[day].water ? (data[day].water / 29.5735) : 0;
  
  let calPercent = dailyGoal > 0 ? Math.min((totals.cal / dailyGoal) * 100, 150) : 0;
  let calColor = calPercent < 90 ? "#00FF7F" : calPercent <= 100 ? "#FFD700" : "#FF4C4C";
  
  let protPercent = dailyProtGoal > 0 ? (totals.p / dailyProtGoal) * 100 : 0;
  protPercent = Math.min(protPercent, 150);
  let protColor = protPercent < 90 ? "#00FF7F" : protPercent <= 100 ? "#FFD700" : "#FF4C4C";
  
  let waterPercent = dailyWaterGoal > 0 ? Math.min((waterOz / dailyWaterGoal) * 100, 100) : 0;
  let waterColor = waterPercent < 80 ? "#00BFFF" : waterPercent < 100 ? "#1E90FF" : "#0000CD";
  
  const dailyCard = document.getElementById("dailyProgressCard");
  const dailyContent = document.getElementById("dailyProgressContent");
  if(dailyCard && dailyContent){
    dailyCard.style.display = "block";
    document.getElementById("dailyProgressHeading").textContent = `Daily Progress — ${dayNames[day]}`;
    dailyContent.innerHTML = `
      <div class="side-bars">
        <div class="bar-group">
          <div class="progress-container daily">
            <div class="progress-bar" style="width:${calPercent}%; background:${calColor};"></div>
          </div>
          <div class="side-label">Calories: ${Math.round(totals.cal)}/${Math.round(dailyGoal)} kcal</div>
        </div>
        <div class="bar-group">
          <div class="progress-container daily">
            <div class="progress-bar" style="width:${protPercent}%; background:${protColor};"></div>
          </div>
          <div class="side-label">Protein: ${Math.round(totals.p)}/${dailyProtGoal} g</div>
        </div>
        <div class="bar-group">
          <div class="progress-container daily">
            <div class="progress-bar" style="width:${waterPercent}%; background:${waterColor};"></div>
          </div>
          <div class="side-label">Water: ${Math.round(waterOz)}/${dailyWaterGoal} oz</div>

      </div>
      <div class="entry-row" style="margin-top:8px;"><span>Carbs: ${Math.round(totals.c)} g | Fat: ${Math.round(totals.f)} g</span></div>

  const foodItem = {name, cal, p, c, f};
  // If we're editing a specific saved item, update that index.
  if(typeof editingSavedIndex === 'number' && editingSavedIndex >= 0 && editingSavedIndex < savedFoods.length){
    savedFoods[editingSavedIndex] = foodItem;
    editingSavedIndex = null;
    const saveBtnReset = document.getElementById('saveFoodBtn');

  document.getElementById("addFoodBtn").textContent = 'Update Food';

function addFoodEntry(){
  const day = +document.getElementById("day").value;
  const name = document.getElementById("foodName").value.trim();
  const cal = +document.getElementById("foodCal").value || 0;
  const p = +document.getElementById("foodProtein").value || 0;
  const c = +document.getElementById("foodCarbs").value || 0;
  const f = +document.getElementById("foodFat").value || 0;
  const qty = +document.getElementById("foodQuantity").value || 1;
  if(!name && cal <= 0) return; // nothing to add
  data[day].entries = data[day].entries || [];
  
  const addFoodBtn = document.getElementById("addFoodBtn");
  const editingIndex = addFoodBtn.dataset.editingIndex;
  
  if(editingIndex !== undefined && editingIndex !== ''){
    // Update existing entry
    data[day].entries[editingIndex] = {name, cal, p, c, f, qty};
    delete addFoodBtn.dataset.editingIndex;
    addFoodBtn.textContent = 'Add Food';
  } else {
    // Add new entry
    data[day].entries.push({name, cal, p, c, f, qty});
  }
  
  // recompute totals from entries
  const totals = getDayTotals({entries: data[day].entries});
  data[day].totals = totals;
  // clear inputs
  document.getElementById("foodName").value = '';
  document.getElementById("foodCal").value = '';
  document.getElementById("foodProtein").value = '';
  document.getElementById("foodCarbs").value = '';
  document.getElementById("foodFat").value = '';
  document.getElementById("foodQuantity").value = '1';
  save();
  populateDayInputs();
}

function deleteFoodEntry(index){
  const day = +document.getElementById("day").value;
  if(!Array.isArray(data[day].entries)) return;
  data[day].entries.splice(index,1);
  // recompute totals
  data[day].totals = getDayTotals({entries: data[day].entries});
  save();
  populateDayInputs();
}

function deleteCurrentWeekEntry(dayIdx, entryIndex){
  if(!Array.isArray(data[dayIdx].entries)) return;
  data[dayIdx].entries.splice(entryIndex, 1);
  data[dayIdx].totals = getDayTotals({entries: data[dayIdx].entries});

  }
});

// Render Week History
function renderWeekHistory(){
  const currentWeekContainer = document.getElementById("currentWeekContainer");
  const previousWeeksContainer = document.getElementById("previousWeeksContainer");
  if(currentWeekContainer) currentWeekContainer.innerHTML = "";
  if(previousWeeksContainer) previousWeeksContainer.innerHTML = "";

  // Ensure the current week card is always rendered at the top
  const weekKeys = Object.keys(allWeeks).sort();
  // newest previous weeks first so the oldest previous week renders last (at bottom)
  const otherWeeks = weekKeys.filter(k=>k!==currentWeekKey).sort().reverse();
  const orderedWeekKeys = [currentWeekKey, ...otherWeeks];
  const totalOtherWeeks = otherWeeks.length;

  orderedWeekKeys.forEach((weekKey,index)=>{
    const weekData = allWeeks[weekKey].entries;
    const card = document.createElement("div");
    card.className = "card";
    const isCurrent = weekKey === currentWeekKey;
    if(isCurrent) card.classList.add("current-week");
    const weeklyTarget = getWeeklyCalTarget();
    const adjustedCalorieGoals = (isCurrent && autoAdjustCalorieBudget)
      ? getAutoAdjustedCalorieGoals(weekData, weeklyTarget)
      : Array(7).fill(Number(personalDailyCalGoal) || 0);

    const isCollapsed = !isCurrent && !showPreviousWeeks;

    let totalWeekCalories=0;
    let totalWeekProtein=0;
    // determine heading label: current week gets a special label; for previous weeks
    // Week 1 = the oldest week (rendered last / at the bottom of the list),
    // Week N = the most recent previous week (rendered just below the current week).
    let weekLabel;
    if(isCurrent) {
      weekLabel = "Current Week";
    } else {
      // index is 1-based position among other weeks (1 = newest, N = oldest).
      // Reverse so oldest gets label "Week 1".
      weekLabel = `Week ${totalOtherWeeks - index + 1}`;
    }

    const startingWeight = allWeeks[weekKey].startingWeight;
    const weightLabel = startingWeight ? ` (Start: ${startingWeight} lbs)` : "";
    // use display order when rendering days (Saturday at top, Sunday at bottom)
    let html = displayDayOrder.map(dayIdx=>{
      const dayData = weekData[dayIdx];
      const totals = getDayTotals(dayData);
      const dayTotal = Math.round(totals.cal);
      const proteinTotal = Math.round(totals.p);
      const carbsTotal = Math.round(totals.c);
      const fatTotal = Math.round(totals.f);
      dayData.water = dayData.water||0;
      totalWeekCalories += dayTotal;
      totalWeekProtein += proteinTotal;

      const dailyProtGoal = personalDailyProteinGoal;
      const dailyWaterGoal = personalDailyWaterGoal;
      const dailyCalGoal = Math.max(adjustedCalorieGoals[dayIdx] || 0, 0);
      // calories progress
      let calPercent = dailyCalGoal > 0 ? Math.min((dayTotal / dailyCalGoal) * 100, 150) : 0;
      let calColor = calPercent < 90 ? "#00FF7F" : calPercent <= 100 ? "#FFD700" : "#FF4C4C";

      let percent = dailyProtGoal > 0 ? (proteinTotal/dailyProtGoal)*100 : 0;
      percent = Math.min(percent,150);
      let barColor = percent < 90 ? "#00FF7F" : percent <= 100 ? "#FFD700" : "#FF4C4C";

      const ML_PER_OZ = 29.5735;
      const waterOz = dayData.water? (dayData.water/ML_PER_OZ) : 0;
      let waterPercent = dailyWaterGoal>0 ? Math.min((waterOz/dailyWaterGoal)*100,100) : 0;
      let waterColor = waterPercent < 80 ? "#00BFFF" : waterPercent < 100 ? "#1E90FF" : "#0000CD";
      return `<div class="day-card">
        <div style="display:flex; align-items:center; justify-content:space-between;">
          <strong>${dayNames[dayIdx]} — ${dayTotal} kcal</strong>
          <button class="primary-btn toggle-day-btn" style="margin-left:8px;">Hide</button>
        </div>
        <div class="day-progress">
          <div class="side-bars">
            <div class="bar-group">
              <div class="progress-container daily">
                <div class="progress-bar" style="width:${calPercent}%; background:${calColor};"></div>
              </div>
              <div class="side-label">Calories: ${dayTotal}/${Math.round(dailyCalGoal)} kcal</div>
            </div>
            <div class="bar-group">
              <div class="progress-container daily">
                <div class="progress-bar" style="width:${percent}%; background:${barColor};"></div>
              </div>
              <div class="side-label">Protein: ${proteinTotal}/${dailyProtGoal} g</div>
            </div>
            <div class="bar-group">
              <div class="progress-container daily">
                <div class="progress-bar" style="width:${waterPercent}%; background:${waterColor};"></div>
              </div>
              <div class="side-label">Water: ${Math.round(waterOz)}/${dailyWaterGoal} oz</div>
            </div>
          </div>
          <br>
          <div class="entry-row"><span>Protein: ${proteinTotal} g | Carbs: ${carbsTotal} g | Fat: ${fatTotal} g</span></div>
          <div class="day-entries" style="display:block;">
            ${Array.isArray(dayData.entries) && dayData.entries.length ? (`<div style="margin-top:8px;">` + dayData.entries.map((e,entryIdx)=>{
              const name = e.name || 'Food';
              const cal = Number(e.cal)||0;
              const p = Number(e.p)||0;
              const c = Number(e.c)||0;
              const f = Number(e.f)||0;
              const deleteButton = isCurrent ? `<button class="danger-btn delete-week-entry-btn" data-day="${dayIdx}" data-entry="${entryIdx}" style="margin-left:8px;">Delete</button>` : '';
              return `<div class="entry-row"><span>${name} — ${Math.round(cal)} kcal | ${Math.round(p)} g protein | ${Math.round(c)} g carbs | ${Math.round(f)} g fat</span>${deleteButton}</div>`;
            }).join('') + `</div>`) : ''}
          </div>
        </div>
      </div>`;
    }).join("<hr>");
    // calculate week progress for this card
    let weekPercent = 0;
    if (weeklyTarget > 0) {
      weekPercent = Math.min((totalWeekCalories / weeklyTarget) * 100, 100);
    }
    let weekBarColor = "#00FF7F";
    if (weekPercent >= 80 && weekPercent < 100) {
      weekBarColor = "#FFD700";
    } else if (weekPercent >= 100) {
      weekBarColor = "#FF4C4C";
    }
    const weekRemainingText = (() => {
      if (weeklyTarget <= 0) return "Set a daily calorie goal";
      const difference = Math.round(weeklyTarget - totalWeekCalories);
      return difference >= 0
        ? `Calories Remaining: ${difference} kcal`
        : `Calories Over: ${Math.abs(difference)} kcal`;
    })();

    const weekProgressHTML = `<div class="progress-container weekly">
        <div class="progress-bar" style="width:${weekPercent}%; background:${weekBarColor};"></div>
      </div>
      <div class="remaining">${weekRemainingText}</div>`;

    const weightHTML = startingWeight ? `<div style="background:#333;padding:6px 12px;border-radius:6px;font-size:9px;"><strong>Start Weight:</strong> ${startingWeight} lbs</div>` : "";

    const toggleBtnHTML = !isCurrent
      ? `<button class="primary-btn toggle-week-btn" style="margin-left:8px;">${isCollapsed ? "Show" : "Hide"}</button>`
      : "";
    const editBtnHTML = !isCurrent ? `<button class="primary-btn edit-week-btn" style="margin-left:8px;">Edit Week</button>` : "";

    const toggleAllDaysHTML = `<button class="primary-btn toggle-all-days-btn" style="margin-left:8px;">Hide All</button>`;

    card.innerHTML = `
      <div style="display:flex; align-items:center; justify-content:space-between;">
        <strong class="week-heading">${weekLabel}</strong>
        <div style="display:flex; align-items:center; gap:8px;">
          ${weightHTML}
            ${toggleBtnHTML}
            ${editBtnHTML}
          ${toggleAllDaysHTML}
        </div>
      </div>
      ${weekProgressHTML}
      <div class="week-details" style="display:${isCollapsed ? "none" : "block"};">
        <div class="total">
          <div class="week-total">Total Calories: ${Math.round(totalWeekCalories)}</div>
          <div>${html}</div>
        </div>
      </div>
    `;
    if(isCurrent){
      currentWeekContainer.appendChild(card);
    } else if(previousWeeksContainer){
      previousWeeksContainer.appendChild(card);
    }

    // allow editing this previous week (make it the active week)
    const editWeekBtn = card.querySelector('.edit-week-btn');
    if(editWeekBtn){
      editWeekBtn.addEventListener('click', ()=>{
        if(!confirm('Make this week the active week for editing?')) return;
        currentWeekKey = weekKey;
        data = allWeeks[currentWeekKey].entries;
        // update week-start weight input to reflect selected week
        weekWeightInput.value = allWeeks[currentWeekKey].startingWeight || '';
        populateDays();
        populateDayInputs();
        renderWeekHistory();
        // navigate to daily macros for editing
        window.location.hash = 'dailyMacros';
        showPageFromHash();
      });
    }

    // allow toggling previous week details
    if (!isCurrent) {
      const toggleBtn = card.querySelector(".toggle-week-btn");
      const details = card.querySelector(".week-details");
      if (toggleBtn && details) {
        toggleBtn.addEventListener("click", () => {
          const hidden = details.style.display === "none";
          details.style.display = hidden ? "block" : "none";
          toggleBtn.textContent = hidden ? "Hide" : "Show";
        });
      }
    }

    // allow deleting current week entries from the week card
    card.querySelectorAll('.delete-week-entry-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const dayIdx = Number(btn.dataset.day);
        const entryIndex = Number(btn.dataset.entry);
        deleteCurrentWeekEntry(dayIdx, entryIndex);
      });
    });

    // allow toggling each day independently
    const dayToggles = card.querySelectorAll(".toggle-day-btn");
    dayToggles.forEach(btn => {
      const entries = btn.closest(".day-card")?.querySelector(".day-entries");
      if (!entries) return;
      btn.addEventListener("click", () => {
        const hidden = entries.style.display === "none";
        entries.style.display = hidden ? "block" : "none";
        btn.textContent = hidden ? "Hide" : "Show";
      });
    });

    // allow hiding/showing all days at once
    const toggleAllDaysBtn = card.querySelector(".toggle-all-days-btn");
    if (toggleAllDaysBtn) {
      toggleAllDaysBtn.addEventListener("click", () => {
        const dayEntries = card.querySelectorAll(".day-entries");
        if (!dayEntries.length) return;
        const isHidden = dayEntries[0].style.display === "none";
        dayEntries.forEach(d => {
          d.style.display = isHidden ? "block" : "none";
        });
        toggleAllDaysBtn.textContent = isHidden ? "Hide All" : "Show All";
      });
    }

    // Weekly Calories Progress
    const progressEl=document.getElementById("weeklyProgress");
    const remainingEl=document.getElementById("weeklyRemaining");
    const progressElDaily=document.getElementById("weeklyProgressDaily");
    const remainingElDaily=document.getElementById("weeklyRemainingDaily");
    if (weekKey === currentWeekKey) {
      const weeklyTarget = getWeeklyCalTarget();

      let percent = 0;
      if (weeklyTarget > 0) {
        percent = Math.min((totalWeekCalories / weeklyTarget) * 100, 100);
      }

      // Progress Bar Colors
      let barColor = "#00FF7F"; // green default

      if (percent >= 80 && percent < 100) {
        barColor = "#FFD700"; // yellow when almost full
      } else if (percent >= 100) {
        barColor = "#FF4C4C"; // red when goal reached or exceeded
      }

      progressEl.style.width = percent + "%";
      progressEl.style.background = barColor;
      if(progressElDaily) { progressElDaily.style.width = percent + "%"; progressElDaily.style.background = barColor; }

      if (weeklyTarget > 0) {
        const difference = Math.round(weeklyTarget - totalWeekCalories);
        const text = difference >= 0
          ? `Calories Remaining: ${difference} kcal`
          : `Calories Over: ${Math.abs(difference)} kcal`;
        remainingEl.textContent = text;
        if(remainingElDaily) remainingElDaily.textContent = text;
      } else {
        remainingEl.textContent = "Set a daily calorie goal";
        if(remainingElDaily) remainingElDaily.textContent = "Set a daily calorie goal";
      }
    }
  });

  if(previousWeeksContainer && previousWeeksContainer.innerHTML.trim() === ""){
    previousWeeksContainer.innerHTML = `<div class="card"><p style="margin:0;color:#aaa;">No previous weeks available yet.</p></div>`;
  }
}
    // Deselect Input on Enter 
const inputs = document.querySelectorAll('input');

inputs.forEach(input => {
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      e.preventDefault(); // prevent form submission if any
      input.blur();      // remove focus from the input
    }
  });
});

// Wire up the previous weeks toggle button
updateHistoryToggleBtn();
document.getElementById("toggleHistoryBtn").addEventListener("click", () => {
  showPreviousWeeks = !showPreviousWeeks;
  localStorage.setItem("showPreviousWeeks", JSON.stringify(showPreviousWeeks));
  updateHistoryToggleBtn();
  renderWeekHistory();
});

function showPageFromHash(){
  const pages = document.querySelectorAll('.page');
  const navLinks = document.querySelectorAll('.nav-link');
  const validPages = ['week', 'previousWeeks', 'setGoals', 'dailyMacros', 'theme'];
  let pageId = window.location.hash.replace('#','') || 'week';
  if(!validPages.includes(pageId)) pageId = 'week';
  pages.forEach(page => page.classList.toggle('active', page.id === pageId));
  navLinks.forEach(link => link.classList.toggle('active', link.getAttribute('href') === `#${pageId}`));
  const target = document.getElementById(pageId);
  if(target){
    target.scrollIntoView({behavior:'smooth', block:'start'});
  }
}

window.addEventListener('hashchange', showPageFromHash);
showPageFromHash();
renderWeekHistory();
</script>
